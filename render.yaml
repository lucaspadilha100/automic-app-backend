services:
  - type: web
    name: automic-app-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter # free tier sleeps after inactivity, which reintroduces cold starts
    healthCheckPath: /health/live
    # Render sets $PORT; migrations run here rather than at build so they see the
    # production database, and the deploy fails loudly if a migration fails.
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DB_POOL_SIZE
        value: "10"
      - key: DB_MAX_OVERFLOW
        value: "20"
      - key: DATABASE_URL
        sync: false # set in the dashboard — never commit the connection string
      - key: SECRET_KEY
        generateValue: true
